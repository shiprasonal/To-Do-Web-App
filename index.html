<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>My To-Do List</h1>
      <button id="themeBtn" class="btn" type="button" aria-label="Switch dark or light mode">🌙 Dark</button>
    </header>

    <form id="taskForm" class="add">
      <input id="taskInput" type="text" placeholder="Write a new task..." autocomplete="off">
      <input id="dueInput" type="date" aria-label="Due date (optional)">
      <button type="submit" class="btn primary">Add Task</button>
    </form>
    <p id="error" class="error" hidden>Task cannot be empty. Please write something.</p>

    <nav class="filters" aria-label="Filter tasks">
      <button class="filter active" data-filter="all" type="button">All</button>
      <button class="filter" data-filter="pending" type="button">Pending</button>
      <button class="filter" data-filter="completed" type="button">Completed</button>
    </nav>

    <section id="pendingPanel" class="panel">
      <div class="panel-head">
        <h2>Pending Tasks</h2>
        <span id="pendingCount" class="badge">0 pending</span>
      </div>
      <ul id="pendingList" class="list"></ul>
      <p id="pendingEmpty" class="empty" hidden>No pending tasks. Add one above and get started!</p>
    </section>

    <section id="completedPanel" class="panel">
      <div class="panel-head">
        <h2>Completed Tasks</h2>
        <span id="completedCount" class="badge done-badge">0 completed</span>
      </div>
      <ul id="completedList" class="list"></ul>
      <p id="completedEmpty" class="empty" hidden>Nothing completed yet. You've got this!</p>
    </section>

    <footer class="foot">
      <span id="leftCount">0 tasks left</span>
      <button id="clearBtn" class="link-btn" type="button">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
